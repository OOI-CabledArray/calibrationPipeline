stream = "streamed/ctdpf_optode_sample"
window_gap_h = 12.0                      # bottle times closer than this share one request
pad_h = 1.0                              # request window padding before the first and after the last bottle
half_window_min = 10.0                   # instrument samples within this time of a bottle closure give its instrument value

[early]                                  # scripts/fetch_early.py: the shallow profilers (CTD, oxygen, nitrate) around the earlier cruises
last_year = 2019                         # cruises after this year are not read
window_gap_h = 12.0                      # bottle times closer than this share one request
pad_h = 36.0                             # request window padding before the first and after the last bottle (as [nitrate] half_window_h)

# Longer CTD and oxygen windows where the profiler made fewer than 6 complete upcasts in the first window after the cast: it profiled
