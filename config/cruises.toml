# Inputs and processing parameters, one table per cruise year and site. Relative paths resolve against the repository root.

[parameters]
variable = "salinity"
correction_kind = "additive"        # "additive" (salinity) | "multiplicative" (gain)
bin_size_m = 1.0                    # 1 m depth bins, right-closed, labelled by mid-point
smooth_window_bins = 5              # centred rolling mean over 5 bins
bottle_outlier_psu = 0.01           # flag a bottle if |(CTD-bottle) - median(CTD-bottle)| exceeds this
# false: bins outside the depth range of the shipboard CTD profile are excluded. true: the CTD profile is held constant outside its
# range (numpy.interp). A variant can override it.
extrapolate_reference = false
# Cruise bottle flags: a bottle whose Niskin flag is not in bottle_ok_niskin_flags, or whose discrete salinity flag does not start with
# bottle_ok_salinity_flag_prefix, is excluded from the CTD-vs-Autosal statistics (it stays in bottle_check.csv). A missing flag is ignored.
bottle_ok_niskin_flags = ["No problems noted"]
bottle_ok_salinity_flag_prefix = "Acceptable"

[parameters.upcast]                 # rca_sal.profiler.UpcastParams
smooth_s = 15.0
w_ascend = -0.03
max_gap_s = 30.0
min_span_m = 100.0

[parameters.ctd_downcast]           # rca_sal.seabird.downcast
min_pressure_dbar = 2.0
heave_tolerance_dbar = 0.5


