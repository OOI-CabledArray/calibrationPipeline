[inventory]                              # scripts/instrument_inventory.py
last_year = 2025                         # cruises after this year are not read
max_distance_km = 5.0                    # ship CTD cast start position to the instrument's deployment position
max_distance_rov_km = 0.25               # the same for ROV bottle samples, which are taken at the instrument
max_depth_difference_m = 30.0            # bottle depth to the deployment depth, fixed-depth instruments only
max_gap_hours = 72.0                     # bottle closure time to the nearest start or stop of a deployment, when none contains it
sites = ["RS01SBPD", "RS01SBPS", "RS01SLBS", "RS01SUM1", "RS01SUM2", "RS03ASHS", "RS03AXBS", "RS03AXPD", "RS03AXPS", "RS03CCAL",
