# --- oxygen (DOFSTA) -----------------------------------------------------------------------------
# The DOFSTA file of a run is a separate OOINet request over the time span of its CTDPFA file
# (scripts/fetch_profiler.py --variable oxygen --match-profiler), so salinity and oxygen use the same upcasts; the DOFSTA data in a
# CTDPFA request have no depth. The cast is the salinity cast; Winkler data come from the cruise discrete summary. Variants are the
