#          "nearest_upcast"-> samples of the upcast closest in time to the CTD cast
#          "first_upcasts" -> the first n_upcasts complete upcasts (span >= min_span_m) that start at or after the CTD cast start
#                             (NMEA time in the .cnv header), pooled; the run stops if the data hold fewer
