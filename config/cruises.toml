# --- variants -----------------------------------------------------------------------------------
# select : "notebook_window_ascending"  -> samples where depth decreased since the previous sample, inside `window` when given
#          "upcasts"       -> all samples in labelled upcasts (rca_sal.profiler.label_upcasts)
#          "nearest_upcast"-> samples of the upcast closest in time to the CTD cast
#          "first_upcasts" -> the first n_upcasts complete upcasts (span >= min_span_m) that start at or after the CTD cast start
#                             (NMEA time in the .cnv header), pooled; the run stops if the data hold fewer
#          "each_upcast"   -> one variant per labelled upcast
#          "index_<rule>"  -> the same rule applied to the upcasts of the official profile index (start to peak)
