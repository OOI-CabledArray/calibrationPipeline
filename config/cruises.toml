# =============================================================================================
# Deployment summary (rca_sal/deployments.py, Streamlit "Deployments" page, scripts/deployments.py)
# =============================================================================================
# Each check is graded against a target and a limit: pass (value meets the target), marginal (between target and limit) or fail
# (beyond the limit, or no usable data). The severity of a check gives the status level reached by a marginal or failed outcome; the
# deployment level is the maximum over its checks. better = "higher" where a larger value is better.
# Targets, limits and severities are provisional and affect only the summary, not the calibrations.
# --- nitrate (scripts/run_year.py --variable nitrate) ---------------------------------------------
# OOI BGC Best Practices guide v1.1.1, chapter 3: OOI L2 nitrate (salinity_corrected_nitrate, TCSS algorithm) against the discrete
# nitrate of the reference cast; the SUNA profile closest in time to the cast is compared; matchups by temperature (recommended) and depth.
[nitrate]
method = "OOI Biogeochemical Sensor Data: Best Practices & User Guide v1.1.1 (Palevsky, Clayton et al. 2023, doi:10.25607/OBP-1865.2), chapter 3"
half_window_h = 36.0                   # OOINet request: cast time +/- this (the SUNA samples on two upcasts a day)
profile_gap_min = 30.0                 # SUNA samples further apart than this belong to different profiles
min_profile_samples = 10
min_profile_span_m = 100.0               # a profile spanning less was taken with the profiler parked ('parked')
spike_window = 5                       # spike test: |x - running median of this many samples| > spike_threshold_um is removed
spike_threshold_um = 2.0
bin_size_m = 2.0                       # profile binned to 2 m (SUNA vertical resolution on the cabled profilers, guide 3.1)
accuracy_um = 2.0                      # sensor accuracy (guide 3.1); also the DI reference-update tolerance
bottle_outlier_um = 10.0               # matchup left out when |difference - median difference| exceeds this (5 x accuracy): gross errors only
bottles = "summary"                    # discrete nitrate from discrete_summary_csv, rows of the cast named by `cast`

[deployments]
single_upcast_variants = ["nearest_upcast_depSM"]          # first present is compared with the primary (salinity)
single_upcast_variants_oxygen = ["nearest_upcast_depSM"]
level_labels = { 1 = "good", 2 = "minor issues", 3 = "use with caution", 4 = "not recommended" }

[deployments.severity_levels]          # status level reached by a marginal / failed check of each severity
critical = { marginal = 3, fail = 4 }
major = { marginal = 2, fail = 3 }
minor = { marginal = 1, fail = 2 }

[deployments.salinity]
# reduction in RMSE of (profiler - CTD) after applying the flat offset, in %
rmse_reduction_pct = { severity = "critical", target = 5.0, limit = 0.0, better = "higher" }
# |median(CTD - Autosal)| on the CTD sensor used by the primary variant, outliers removed
reference_median_abs_psu = { severity = "major", target = 0.005, limit = 0.01, min_bottles = 3 }
# |primary - single upcast nearest the cast|
primary_minus_single_upcast_psu = { severity = "major", target = 0.02, limit = 0.05 }
# IQR of the per-bin profiler - CTD differences of the primary variant
iqr_psu = { severity = "major", target = 0.03, limit = 0.05 }
# |offset against the primary CTD sensor - offset against the secondary sensor|
sensor_agreement_psu = { severity = "minor", target = 0.005, limit = 0.01 }
# |mean profiler time - CTD cast time| of the primary variant
time_gap_h = { severity = "minor", target = 6.0, limit = 24.0 }

[deployments.oxygen]
rmse_reduction_pct = { severity = "critical", target = 50.0, limit = 0.0, better = "higher" }
# |gain via the CTD (Winkler -> CTD -> DOFSTA) - gain of DOFSTA directly against Winkler|
chain_vs_direct_gain = { severity = "major", target = 0.01, limit = 0.03 }
primary_minus_single_upcast_gain = { severity = "major", target = 0.01, limit = 0.02 }
# |gain - 1|; the OOI BGC Best Practices guide (section 2.4.1) quotes 5-10 % SBE43 drift over a 100-day deployment
gain_departure_from_one = { severity = "major", target = 0.05, limit = 0.10 }
# number of Winkler bottles within the depth range of the CTD profile (guide section 2.5.4: avoid correcting from one or two points)
winkler_bottles_used = { severity = "major", target = 3, limit = 1, better = "higher" }
gain_iqr = { severity = "major", target = 0.05, limit = 0.1 }
time_gap_h = { severity = "minor", target = 6.0, limit = 24.0 }

# =============================================================================================
# Uploaded runs (Streamlit upload page / rca_sal.uploads)
# =============================================================================================
[deployments.nitrate]                  # provisional; OOI BGC guide chapter 3
matchups_used = { severity = "major", target = 6, limit = 3, better = "higher" }
rmse_reduction_pct = { severity = "critical", target = 25.0, limit = 0.0, better = "higher" }
# |median(bottle - SUNA)|: the guide expects the in situ sensor within +/-2 umol/L of the discrete samples at deployment (3.4)
offset_abs_um = { severity = "major", target = 2.0, limit = 5.0 }
fit_r2 = { severity = "major", target = 0.98, limit = 0.95, better = "higher" }
fit_slope_departure = { severity = "major", target = 0.05, limit = 0.10 }
temperature_vs_depth_offset_um = { severity = "minor", target = 0.5, limit = 1.0 }
profile_offset_range_um = { severity = "minor", target = 1.0, limit = 2.0 }
time_gap_h = { severity = "minor", target = 6.0, limit = 24.0 }
# the nearest SUNA record is a full profile (fails when the profiler was parked: one-point comparison)
full_profile = { severity = "major", target = 1, limit = 1 }

[upload]
template_year = "2025"     # parameters, variants and the oxygen settings of this year are used for uploaded runs
max_file_mb = 200          # per uploaded file (keep in line with server.maxUploadSize in .streamlit/config.toml)
workspace_max_age_h = 6    # stale upload workspaces older than this are deleted when a new one is created

# =============================================================================================
# Discrete-sample data on GitHub. An input "github:<path>" is fetched at run time (rca_sal.github_data) from the repository below at
# the commit given as ref (a branch name would follow its latest commit). Records name the commit and git blob of each file read.
# Cache: data/cache/github/<commit>/ (not committed).
